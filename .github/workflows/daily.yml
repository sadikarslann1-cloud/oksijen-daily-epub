name: Oksijen Daily EPUB

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  build-epub:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build EPUB and upload to Drive
        env:
          OXY_SCRIPT_URL: ${{ secrets.OXY_SCRIPT_URL }}
        run: node index.js
