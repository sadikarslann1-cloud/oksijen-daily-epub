name: O2

on:
  schedule:
    - cron: '0 3 * * *'    # 06:00 TR — Oksijen
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Hangi site inşa edilsin?'
        required: true
        default: 'both'
        type: choice
        options:
          - oksijen

jobs:

  build-oksijen:
    if: (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'oksijen')) || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Oksijen EPUB and upload to Drive
        env:
          OXY_SCRIPT_URL: ${{ secrets.OXY_SCRIPT_URL }}
        run: node index.js
