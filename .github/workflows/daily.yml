name: Gunluk Seyrusefer

on:
  schedule:
    # Her gün Türkiye saatiyle 08:00'de çalışır (UTC+3)
    - cron: '0 5 * * *' 
      timezone: "Europe/Istanbul"
  workflow_dispatch: # Test etmek için manuel çalıştırma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bagimliliklari Yukle
        run: npm install

      - name: Seyruseferi Calistir
        env:
          OKSIJEN_COOKIES: ${{ secrets.OKSIJEN_COOKIES }}
          GAS_URL: ${{ secrets.GAS_URL }}
        run: node index.js
