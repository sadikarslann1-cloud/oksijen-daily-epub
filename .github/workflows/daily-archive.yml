name: 📰 Günlük Gazete (EPUB)

on:
  schedule:
    - cron: '0 6 * * *'      # Her gün 09:00 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Tam metinleri çek ve EPUB üret
        run: python scripts/fetch_rss.py

      - name: 📂 Drive'a Yükle
        uses: samuelint/google-drive-upload@v1.1.3
        with:
          # DRIVE_KLASOR_ID kısmına Drive'daki hedef klasörünün ID'sini yazacaksın
          folder_id: ${{ secrets.DRIVE_KLASOR_ID }} 
          service_account: ${{ secrets.GDRIVE_CREDENTIALS }}
          source_path: 'epub_ciktilar/*.epub'

      - name: Değişiklikleri repoya kaydet (Yedek)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📚 Günlük EPUB üretildi — ${{ github.run_id }}"
          file_pattern: 'epub_ciktilar/*.epub'
